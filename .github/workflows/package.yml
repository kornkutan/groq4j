name: package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: mvn -B -ntp deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/kornkutan/groq4j
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
